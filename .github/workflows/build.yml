name: Build Pico UF2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (including picotool)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
                                  libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev

      - name: Build Pico Project
        id: build
        uses: samyarsadat/Pico-Build-Action@v1
        with:
          source_dir: "src"
          cmake_args: >
            -DCMAKE_BUILD_TYPE=Release
            -DPICO_SDK_FETCH_FROM_GIT=ON
            -DPICO_BOARD=pico

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: ${{ steps.build.outputs.output_dir }}/**/*.uf2
          retention-days: 30
          if-no-files-found: error
